<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual research map for a Minecraft-based disaster preparedness thesis</title>
  <desc id="desc">A compact light diagram showing the conceptual research flow from a simulated scenario to player decisions, behavioral signals, an explainable model, and actionable insight.</desc>
  <rect width="420" height="920" fill="#f7f7f2"/>
  <g fill="none" stroke="#c9cec6" stroke-width="1"><path d="M24 28H396M24 892H396M24 28V892M396 28V892"/><path d="M24 103H396M24 834H396" stroke-dasharray="3 6"/></g>
  <g fill="#59615b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing=".8"><text x="24" y="18">RESEARCH MAP / CONCEPTUAL</text><text x="24" y="912">HIGH-LEVEL MAP · NOT AN IMPLEMENTATION CLAIM</text></g>
  <g fill="#1e2521" font-family="Arial, Helvetica, sans-serif"><text x="42" y="142" font-size="18" font-weight="700">Minecraft-based disaster preparedness</text><text x="42" y="165" font-size="18" font-weight="700">simulation with XAI</text></g>
  <g font-family="Arial, Helvetica, sans-serif" stroke="#28302b" stroke-width="2">
