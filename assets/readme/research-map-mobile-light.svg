    <g transform="translate(42 324)"><rect width="336" height="96" fill="#f7f7f2"/><text x="18" y="28" fill="#59615b" stroke="none" font-family="ui-monospace, monospace" font-size="11" letter-spacing=".8">02 / INTERACTION</text><text x="18" y="65" fill="#28302b" stroke="none" font-size="19" font-weight="700">PLAYER DECISIONS</text><circle cx="298" cy="49" r="16" fill="none" stroke="#c56447" stroke-width="3"/><path d="M282 49h32M298 33v32" stroke="#c56447" stroke-width="3"/></g>
    <g transform="translate(42 446)"><rect width="336" height="96" fill="#e7ece5"/><text x="18" y="28" fill="#59615b" stroke="none" font-family="ui-monospace, monospace" font-size="11" letter-spacing=".8">03 / OBSERVATION</text><text x="18" y="65" fill="#28302b" stroke="none" font-size="19" font-weight="700">BEHAVIORAL SIGNALS</text><path d="M278 66V50m12 16V32m12 34V42m12 24V25" stroke="#c56447" stroke-width="5"/></g>
