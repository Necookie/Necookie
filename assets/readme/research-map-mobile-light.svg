    <g transform="translate(42 690)"><rect width="336" height="96" fill="#e7ece5"/><text x="18" y="28" fill="#59615b" stroke="none" font-family="ui-monospace, monospace" font-size="11" letter-spacing=".8">05 / RESPONSE</text><text x="18" y="65" fill="#28302b" stroke="none" font-size="19" font-weight="700">ACTIONABLE INSIGHT</text><path d="M276 64l12-14 10 8 18-24" fill="none" stroke="#c56447" stroke-width="3"/></g>
