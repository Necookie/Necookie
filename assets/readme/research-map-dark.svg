  <g fill="#aeb8ae" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing=".8"><text x="75" y="144">01 / ENVIRONMENT</text><text x="295" y="144">02 / INTERACTION</text><text x="515" y="144">03 / OBSERVATION</text><text x="735" y="144">04 / INTERPRETATION</text><text x="955" y="144">05 / RESPONSE</text></g>
